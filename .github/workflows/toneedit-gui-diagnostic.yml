name: ToneEdit Windows GUI diagnostics (prebuilt EXEs)
on:
  push:
    branches: [toneedit-studio-ci-20261112]
    paths:
      - '.github/workflows/toneedit-gui-diagnostic.yml'
  workflow_dispatch:
jobs:
  diagnosis:
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 43067429638
          name: ToneEdit-Studio-Windows-EXE-MIT
          github-token: ${{ github.token }}
          path: prebuilt
      - name: Diagnose display and GUI startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $dir = 'prebuilt/ToneEdit-Studio-1.2.1-Windows-x64-MIT-Free'
          New-Item -ItemType Directory -Force diagnostic | Out-Null
          Get-CimInstance Win32_VideoController | Format-List * | Out-File diagnostic/gpu.txt
          (Get-Process explorer -ErrorAction SilentlyContinue | Out-String) | Out-File diagnostic/explorer.txt
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | Format-List * | Out-File diagnostic/screens.txt
          foreach ($exe in @('toneedit-studio.exe','toneedit-setup.exe')) {
            $p = Join-Path $dir $exe
            try {
              $proc = Start-Process -FilePath $p -PassThru -Wait -RedirectStandardError ("diagnostic/" + $exe + ".stderr.txt") -RedirectStandardOutput ("diagnostic/" + $exe + ".stdout.txt")
              "exit=$($proc.ExitCode)" | Set-Content ("diagnostic/" + $exe + ".exit.txt")
            } catch {
              $_ | Out-String | Set-Content ("diagnostic/" + $exe + ".exception.txt")
            }
            Get-ChildItem diagnostic/$exe* | ForEach-Object { Write-Host $_.Name; Get-Content $_.FullName | Select-Object -First 25 }
          }
      - name: Upload display and error diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ToneEdit-GUI-Start-Failure-Analysis
          path: diagnostic/**
          if-no-files-found: error
