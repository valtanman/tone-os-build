name: ToneEdit Studio build and 10 GUI trials
on:
  push:
    branches: [toneedit-studio-ci-20261112]
  workflow_dispatch:
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Extract source with 7-Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force workspace | Out-Null
          & 'C:\Program Files\7-Zip\7z.exe' x toneedit/toneedit-source-1.2.2.tar.xz '-oworkspace' -y
          & 'C:\Program Files\7-Zip\7z.exe' x workspace/toneedit-source-1.2.2.tar '-oworkspace' -y
          if (!(Test-Path workspace/ToneEdit-Studio/Cargo.toml)) { throw 'Source extraction failed' }
      - name: Apply verified Rust compiler fixes
        shell: pwsh
        run: |
          $ai='workspace/ToneEdit-Studio/src/ai.rs'
          $editor='workspace/ToneEdit-Studio/src/components/editor.rs'
          $t=Get-Content $ai -Raw -Encoding utf8
          $t=$t.Replace('    /// Account identifiers, passwords, access tokens and API keys are deliberately absent.', '    // Account identifiers, passwords, access tokens and API keys are deliberately absent.')
          [IO.File]::WriteAllText((Resolve-Path $ai),$t,[Text.UTF8Encoding]::new($false))
          $t=Get-Content $editor -Raw -Encoding utf8
          $t=$t.Replace('ui.fonts_mut(','ui.fonts(').Replace('range.primary.index','range.primary.ccursor.index')
          $t=$t.Replace('buf: &dyn egui::TextBuffer','buf: &str').Replace('syntax::highlight(buf.as_str(),','syntax::highlight(buf,')
          [IO.File]::WriteAllText((Resolve-Path $editor),$t,[Text.UTF8Encoding]::new($false))
      - name: Compile and self-test all three EXEs
        working-directory: workspace/ToneEdit-Studio
        shell: pwsh
        run: cargo run --release --manifest-path tools/build-all/Cargo.toml --target-dir tools/build-all/target
      - name: Attempt GUI keyboard actions 10 times per app
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          $dir='workspace/ToneEdit-Studio/dist/ToneEdit-Studio-1.2.1-Windows-x64-MIT-Free'
          New-Item -ItemType Directory -Force gui-qa | Out-Null
          $env:WGPU_BACKEND='dx12'
          $rows=@()
          foreach ($i in 1..10) {
            foreach ($name in @('toneedit-studio.exe','toneedit-setup.exe','toneedit-uninstall.exe')) {
              $argsList=if($name -eq 'toneedit-uninstall.exe'){'--worker'}else{''}
              $proc=Start-Process -FilePath (Join-Path $dir $name) -ArgumentList $argsList -PassThru
              Start-Sleep -Seconds 3
              $proc.Refresh()
              $opened=(-not $proc.HasExited -and $proc.MainWindowHandle -ne [IntPtr]::Zero)
              $typed=$false
              if($opened){try{[System.Windows.Forms.SendKeys]::SendWait('{TAB}');$typed=$true}catch{}}
              $rows+=[pscustomobject]@{iteration=$i;exe=$name;window_open=$opened;keyboard_sent=$typed;passed=($opened -and $typed)}
              if(-not $proc.HasExited){Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue}
            }
          }
          $rows|Export-Csv gui-qa/report.csv -NoTypeInformation -Encoding utf8
          $rows|ConvertTo-Json|Set-Content gui-qa/report.json
          $rows|Format-Table|Out-String|Write-Host
          if(@($rows|Where-Object {-not $_.passed}).Count){throw 'GUI trial failures'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ToneEdit-GUI-10x-log
          path: gui-qa/**
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ToneEdit-Windows-EXE
          path: |
            workspace/ToneEdit-Studio/dist/ToneEdit-Studio-1.2.1-Windows-x64-MIT-Free/**
            workspace/ToneEdit-Studio/dist/ToneEdit-Studio-1.2.1-Windows-x64-MIT-Free.zip
          if-no-files-found: warn
