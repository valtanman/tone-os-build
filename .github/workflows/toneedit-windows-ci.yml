name: ToneEdit Studio Windows EXE & 10x GUI QA
on:
  push:
    branches: [toneedit-studio-ci-20261112]
  workflow_dispatch:
jobs:
  windows_build:
    runs-on: windows-2022
    permissions:
      contents: read
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Extract sources via 7zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force workspace | Out-Null
          $seven = "C:\Program Files\7-Zip\7z.exe"
          if (!(Test-Path $seven)) { throw "7-Zip not installed on Windows runner" }
          & $seven x -y "-oworkspace" "toneedit/toneedit-source-1.2.2.tar.xz"
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract XZ" }
          $tar = Get-ChildItem workspace -Filter "*.tar" | Select-Object -First 1
          if (!$tar) { throw "XZ payload tar missing" }
          & $seven x -y "-oworkspace" $tar.FullName
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract TAR" }
          if (!(Test-Path workspace/ToneEdit-Studio/Cargo.toml)) { throw "Cargo.toml missing" }
      - name: Apply verified compiler fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ai = 'workspace/ToneEdit-Studio/src/ai.rs'
          $edit = 'workspace/ToneEdit-Studio/src/components/editor.rs'
          $text = Get-Content -LiteralPath $ai -Raw -Encoding UTF8
          if (!$text.Contains('    /// Account identifiers, passwords, access tokens and API keys are deliberately absent.')) { throw 'Source content mismatch: ai.rs' }
          $text = $text.Replace('    /// Account identifiers, passwords, access tokens and API keys are deliberately absent.', '    // Account identifiers, passwords, access tokens and API keys are deliberately absent.')
          [System.IO.File]::WriteAllText((Resolve-Path $ai), $text, [System.Text.UTF8Encoding]::new($false))
          $text = Get-Content -LiteralPath $edit -Raw -Encoding UTF8
          if (!$text.Contains('ui.fonts_mut(') -or !$text.Contains('range.primary.index')) { throw 'Source content mismatch: editor.rs' }
          $text = $text.Replace('ui.fonts_mut(', 'ui.fonts(').Replace('range.primary.index', 'range.primary.ccursor.index')
          $text = $text.Replace('buf: &dyn egui::TextBuffer', 'buf: &str').Replace('syntax::highlight(buf.as_str(),', 'syntax::highlight(buf,')
          [System.IO.File]::WriteAllText((Resolve-Path $edit), $text, [System.Text.UTF8Encoding]::new($false))
      - name: Compile and test full Rust EXE installer
        shell: pwsh
        working-directory: workspace/ToneEdit-Studio
        run: cargo run --release --manifest-path tools/build-all/Cargo.toml --target-dir tools/build-all/target
      - name: Validate release bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = 'workspace/ToneEdit-Studio/dist/ToneEdit-Studio-1.2.1-Windows-x64-MIT-Free'
          @('toneedit-studio.exe','toneedit-uninstall.exe','toneedit-setup.exe','LICENSE') | ForEach-Object {
            if (!(Test-Path (Join-Path $dir $_))) { throw "Missing $_" }
          }
      - name: 10 repetitions of compiled executable self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = 'workspace/ToneEdit-Studio/dist/ToneEdit-Studio-1.2.1-Windows-x64-MIT-Free'
          1..10 | ForEach-Object {
            $round = $_
            foreach ($exe in @('toneedit-studio.exe','toneedit-setup.exe','toneedit-uninstall.exe')) {
              & (Join-Path $dir $exe) --self-test
              if ($LASTEXITCODE -ne 0) { throw "Executable $exe failed round $round" }
              Write-Host "PASS core $round/10 $exe"
            }
          }
      - name: Actual Windows GUI launch and keyboard interaction 10 repetitions
        shell: powershell
        continue-on-error: true
        run: |
          .\.github\tests\toneedit-gui-10x.ps1 -ReleaseDirectory 'workspace/ToneEdit-Studio/dist/ToneEdit-Studio-1.2.1-Windows-x64-MIT-Free' -Iterations 10
      - name: Upload 10-round GUI reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ToneEdit-Windows-GUI-10x-QA
          path: ${{ runner.temp }}/ToneEdit-GUI-10x/**
          if-no-files-found: warn
      - name: Upload compiled EXEs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ToneEdit-Studio-Windows-EXE-MIT
          path: |
            workspace/ToneEdit-Studio/dist/ToneEdit-Studio-1.2.1-Windows-x64-MIT-Free/**
            workspace/ToneEdit-Studio/dist/ToneEdit-Studio-1.2.1-Windows-x64-MIT-Free.zip
          if-no-files-found: error
          retention-days: 30
